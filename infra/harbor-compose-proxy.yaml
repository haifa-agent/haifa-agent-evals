services:
  main:
    build:
      args:
        HTTP_PROXY: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
        HTTPS_PROXY: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
        http_proxy: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
        https_proxy: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
    environment:
      HAIFA_EVALS_COMPOSE_NETWORK_PREFLIGHT: "v1"
      HAIFA_EVALS_CONTAINER_PROXY: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
      HAIFA_EVALS_PREFLIGHT_TARGET_URL: ${HAIFA_EVALS_PREFLIGHT_TARGET_URL:-https://api.deepseek.com/}
      HTTP_PROXY: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
      HTTPS_PROXY: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
      http_proxy: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
      https_proxy: ${HAIFA_EVALS_CONTAINER_PROXY:?set HAIFA_EVALS_CONTAINER_PROXY}
      JAVA_TOOL_OPTIONS: ${HAIFA_EVALS_JAVA_PROXY_OPTIONS:-}
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
