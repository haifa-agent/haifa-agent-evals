models:
  default: tokenrhythm-deepseek-v4-flash
  providers:
    - id: tokenrhythm
      displayName: TokenRhythm
      # TODO(tokenrhythm): replace with the official TokenRhythm endpoint host supplied by the user.
      endpoint: https://tokenrhythm.studio/v1
      credentialRef: env://TR_API_KEY
      nativeStreaming: true
      apiBindings:
        - style: openai-chat-completions
          dialect: tokenrhythm-openai-chat
      models:
        - id: tokenrhythm-deepseek-v4-flash
          displayName: TokenRhythm DeepSeek V4 Flash
          providerModelId: ${HAIFA_MODEL_ID}
          style: openai-chat-completions
          capabilities: [TEXT_CHAT, TOOL_CALLING, STRUCTURED_OUTPUT]
          contextWindow: 1000000
          maxOutputTokens: 384000

tools:
  enabled:
    - file.list
    - file.stat
    - file.read
    - file.create
    - file.write
    - file.patch
    - file.delete
    - file.move
    - execution.run

skills:
  allowed: []

approval:
  mode: auto

execution:
  provider: host-guarded
  network: allow
  shell: auto
  defaultTimeoutMillis: 120000
  maxTimeoutMillis: 1200000
  maxOutputLines: 2000
  maxOutputBytes: 51200
  maxProcesses: 32
  inheritEnvironment:
    - PATH
    - JAVA_HOME
    - HOME
    - LANG
    - LC_ALL
    - TMPDIR
    - TMP
    - TEMP
    - GOTMPDIR
    - GOCACHE
  extraPathPolicies: []

runtime:
  maxIterations: 50
  maxToolCalls: 32
  maxWallTimeMillis: 1200000

persistence:
  mode: SQLITE_WITH_JSONL
  databasePath: /tmp/haifa-runtime.db
  transcriptRoot: /tmp/haifa-transcripts
  protection: NONE
  busyTimeoutMillis: 5000
  maximumPayloadBytes: 1048576
